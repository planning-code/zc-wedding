<!DOCTYPE html>
<html lang="es-SV">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0A0A0A">
  <meta name="robots" content="noindex, nofollow">
  <title>Galería · Karlita & Edgardo</title>

  <link rel="icon" type="image/png" href="/assets/monograma.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap">
  <link rel="stylesheet" href="/styles/main.css">
</head>
<body class="gallery-page">

  <header class="gallery-head">
    <a class="gallery-head__back" href="/">← Volver a la invitación</a>
    <p class="kicker">Galería</p>
    <h1 class="section__title">Tus fotos del día</h1>
    <p class="section__sub">Sube las fotos que tomaste. Tú ves las tuyas; Karlita y Edgardo ven todas.</p>
  </header>

  <main class="gallery-main">

    <!-- Gate de login (visible sin sesión) -->
    <div class="auth-gate auth-gate--center" data-auth-gate hidden>
      <p class="auth-gate__text">Inicia sesión con Google para ver y subir tus fotos.</p>
      <button type="button" class="btn btn--google" data-google-login>
        <svg class="g-icon" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92c1.7-1.57 2.68-3.88 2.68-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.8.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.02-3.7H.96v2.34A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.98 10.72a5.4 5.4 0 0 1 0-3.44V4.94H.96a9 9 0 0 0 0 8.12l3.02-2.34z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.46 3.44 1.35l2.58-2.58A9 9 0 0 0 .96 4.94l3.02 2.34C4.68 5.16 6.66 3.58 9 3.58z"/></svg>
        Continuar con Google
      </button>
      <p class="auth-gate__msg" data-auth-msg aria-live="polite"></p>
    </div>

    <!-- Contenido protegido (visible con sesión) -->
    <div class="auth-protected" data-auth-protected hidden>
      <div class="gallery-upload">
        <label class="btn btn--solid gallery-upload__btn" for="gallery-file">Subir fotos</label>
        <input type="file" id="gallery-file" accept="image/*" multiple hidden>
        <label class="btn btn--ghost gallery-upload__btn" for="gallery-camera">Tomar foto</label>
        <input type="file" id="gallery-camera" accept="image/*" capture="environment" hidden>
        <p class="gallery-upload__status" id="gallery-status" aria-live="polite"></p>
      </div>

      <!-- Barra de selección -->
      <div class="gallery-toolbar" id="gallery-toolbar" hidden>
        <button type="button" class="btn btn--ghost btn--mini" id="gallery-select-toggle">Seleccionar</button>
        <div class="gallery-select-actions" id="gallery-select-actions" hidden>
          <span class="gallery-select-count" id="gallery-select-count">0 seleccionadas</span>
          <button type="button" class="btn btn--ghost btn--mini" id="gallery-select-all">Todas</button>
          <button type="button" class="btn btn--solid btn--mini" id="gallery-download-sel" disabled>Descargar</button>
          <button type="button" class="btn btn--ghost btn--mini gallery-btn-danger" id="gallery-delete-sel" hidden disabled>Eliminar</button>
          <button type="button" class="btn btn--ghost btn--mini" id="gallery-select-cancel">Cancelar</button>
        </div>
      </div>

      <div class="gallery-grid" id="gallery-grid" data-role="guest"></div>
      <p class="gallery-empty" id="gallery-empty" hidden>Aún no hay fotos. ¡Sé el primero en subir una!</p>
    </div>

  </main>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox" hidden role="dialog" aria-modal="true" aria-label="Foto ampliada">
    <button class="lightbox__close" id="lightbox-close" type="button" aria-label="Cerrar">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
    <button class="lightbox__nav lightbox__nav--prev" id="lightbox-prev" type="button" aria-label="Foto anterior">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <figure class="lightbox__stage">
      <img class="lightbox__img" id="lightbox-img" alt="">
    </figure>
    <button class="lightbox__nav lightbox__nav--next" id="lightbox-next" type="button" aria-label="Foto siguiente">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg>
    </button>
    <button class="lightbox__download btn btn--solid btn--mini" id="lightbox-download" type="button">Descargar</button>
  </div>

  <script src="/scripts/config.js"></script>
  <script src="/scripts/gallery.js" type="module"></script>
</body>
</html>
